<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>化學闖關 · 必修化學實力評量</title>
<style>
:root{
  --ink:#1a2e35;          /* 深墨綠黑 */
  --paper:#f7f4ec;        /* 米黃紙 */
  --paper-line:#dcd6c4;
  --flask:#2ec4b6;        /* 燒瓶青 */
  --flask-deep:#1a9e93;
  --amber:#ff9f1c;        /* 琥珀橙 */
  --amber-deep:#e07b00;
  --coral:#e63946;        /* 反應紅 */
  --violet:#7b6cf6;       /* 試劑紫 */
  --grape:#5a4fcf;
  --leaf:#43aa8b;         /* 通過綠 */
  --sky:#4cc9f0;
  --shadow:rgba(26,46,53,.14);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  background:var(--paper);
  color:var(--ink);
  line-height:1.7;
  min-height:100vh;
  background-image:
    linear-gradient(var(--paper-line) 1px,transparent 1px);
  background-size:100% 34px;
  background-position:0 -1px;
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:760px;margin:0 auto;padding:0 18px 120px}

/* ---------- 頂部 ---------- */
header.top{
  position:sticky;top:0;z-index:40;
  background:var(--ink);
  color:var(--paper);
  margin:0 -18px 0;
  padding:12px 18px;
  display:flex;align-items:center;gap:12px;
  box-shadow:0 3px 0 var(--flask-deep),0 6px 18px var(--shadow);
}
.logo-flask{width:30px;height:30px;flex:none}
header.top h1{font-size:1.02rem;font-weight:800;letter-spacing:.5px}
header.top .sub{font-size:.72rem;opacity:.7;font-weight:500;margin-top:-2px}
.streak{margin-left:auto;font-size:.8rem;background:rgba(255,159,28,.2);border:1.5px solid var(--amber);color:var(--amber);padding:3px 10px;border-radius:20px;font-weight:700;white-space:nowrap}

/* ---------- 首頁 ---------- */
.hero{text-align:center;padding:34px 10px 20px}
.hero .eyebrow{font-size:.78rem;letter-spacing:3px;color:var(--flask-deep);font-weight:700;text-transform:uppercase}
.hero h2{font-size:2rem;font-weight:900;margin:8px 0 4px;line-height:1.25}
.hero h2 .hl{color:var(--amber-deep);position:relative;white-space:nowrap}
.hero h2 .hl::after{content:"";position:absolute;left:-2px;right:-2px;bottom:2px;height:9px;background:rgba(255,159,28,.32);z-index:-1;border-radius:2px}
.hero p{color:#5c6b6f;font-size:.95rem;max-width:440px;margin:6px auto 0}

.progress-orb{display:flex;justify-content:center;gap:16px;margin:26px 0 8px;flex-wrap:wrap}
.orb{text-align:center}
.orb .num{font-size:1.5rem;font-weight:900;color:var(--flask-deep)}
.orb .lab{font-size:.68rem;color:#7c8a8e;letter-spacing:1px}

/* ---------- 回目卡片 ---------- */
.grid{display:grid;gap:14px;margin-top:20px}
.chapter{
  position:relative;
  background:#fff;
  border:2px solid var(--ink);
  border-radius:16px;
  padding:16px 16px 14px 58px;
  cursor:pointer;
  box-shadow:4px 4px 0 var(--ink);
  transition:transform .12s,box-shadow .12s;
  overflow:hidden;
}
.chapter:hover,.chapter:focus-visible{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--flask-deep);outline:none}
.chapter:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.chapter .badge{
  position:absolute;left:12px;top:14px;
  width:34px;height:34px;border-radius:50%;
  background:var(--flask);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:1.05rem;
  border:2px solid var(--ink);
}
.chapter h3{font-size:1rem;font-weight:800;margin-bottom:2px;padding-right:60px}
.chapter .meta{font-size:.76rem;color:#7c8a8e}
.chapter .done-tag{position:absolute;right:12px;top:14px;font-size:.7rem;font-weight:800;padding:3px 9px;border-radius:20px}
.chapter .done-tag.none{background:#eee;color:#999}
.chapter .done-tag.part{background:rgba(255,159,28,.18);color:var(--amber-deep)}
.chapter .done-tag.full{background:rgba(67,170,139,.18);color:var(--leaf)}
.chapter .bar{height:6px;background:#ece8dc;border-radius:6px;margin-top:10px;overflow:hidden}
.chapter .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--flask),var(--leaf));width:0;border-radius:6px;transition:width .5s}

.reset-all{display:block;margin:26px auto 0;background:none;border:1.5px dashed #b9b3a1;color:#8a8676;font-size:.78rem;padding:7px 16px;border-radius:20px;cursor:pointer}
.reset-all:hover{border-color:var(--coral);color:var(--coral)}

/* ---------- 測驗頁 ---------- */
.quiz-head{display:flex;align-items:center;gap:10px;padding:16px 0 6px}
.back-btn{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:6px 12px;font-weight:700;cursor:pointer;font-size:.82rem;box-shadow:2px 2px 0 var(--ink)}
.back-btn:hover{background:var(--paper)}
.quiz-head .qh-title{font-weight:800;font-size:.9rem;line-height:1.3}
.quiz-head .qh-title small{display:block;color:#7c8a8e;font-weight:500;font-size:.72rem}

.qbar-outer{height:9px;background:#e7e3d6;border-radius:8px;overflow:hidden;margin:4px 0 2px}
.qbar-inner{height:100%;background:linear-gradient(90deg,var(--amber),var(--coral));width:0;transition:width .4s;border-radius:8px}
.qcount{font-size:.74rem;color:#7c8a8e;text-align:right;margin-bottom:8px}

.card{
  background:#fff;border:2px solid var(--ink);border-radius:18px;
  box-shadow:5px 5px 0 var(--ink);
  padding:20px 18px;margin-bottom:16px;
  animation:pop .3s ease;
}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.qtype{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:1px;padding:3px 9px;border-radius:20px;margin-bottom:10px}
.qtype.single{background:rgba(46,196,182,.16);color:var(--flask-deep)}
.qtype.multi{background:rgba(123,108,246,.16);color:var(--grape)}
.qtype.essay{background:rgba(255,159,28,.16);color:var(--amber-deep)}
.qstem{font-size:1.02rem;font-weight:600;line-height:1.75;margin-bottom:8px;white-space:pre-wrap}

.figure{
  background:#f3f6f4;border-left:4px solid var(--flask);
  border-radius:0 10px 10px 0;
  padding:11px 14px;margin:12px 0;font-size:.86rem;color:#3d5158;
}
.figure b{color:var(--flask-deep);display:block;font-size:.72rem;letter-spacing:1px;margin-bottom:3px}

.options{display:grid;gap:9px;margin-top:14px}
.opt{
  display:flex;align-items:flex-start;gap:11px;
  background:#fff;border:2px solid #d9d3c3;border-radius:12px;
  padding:11px 13px;cursor:pointer;text-align:left;font-size:.94rem;
  transition:border-color .12s,background .12s,transform .08s;
  font-family:inherit;color:var(--ink);width:100%;
}
.opt:hover{border-color:var(--flask);background:#f5fbfa}
.opt:active{transform:scale(.99)}
.opt .key{
  flex:none;width:26px;height:26px;border-radius:8px;
  background:var(--paper);border:2px solid #cfc9b8;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:.82rem;color:#7c8a8e;
}
.opt.sel{border-color:var(--violet);background:#f4f2ff}
.opt.sel .key{background:var(--violet);color:#fff;border-color:var(--violet)}
.opt.correct{border-color:var(--leaf);background:#eefaf4}
.opt.correct .key{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.opt.wrong{border-color:var(--coral);background:#fdeeee}
.opt.wrong .key{background:var(--coral);color:#fff;border-color:var(--coral)}
.opt.locked{cursor:default;pointer-events:none}
.opt .mark{margin-left:auto;font-weight:900;font-size:1rem}

.multi-hint{font-size:.74rem;color:var(--grape);margin-top:8px;font-weight:600}

.actions{display:flex;gap:10px;margin-top:16px}
.btn{
  flex:1;border:2px solid var(--ink);border-radius:13px;
  padding:12px;font-weight:800;font-size:.95rem;cursor:pointer;
  font-family:inherit;box-shadow:3px 3px 0 var(--ink);transition:transform .1s,box-shadow .1s;
}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--amber);color:var(--ink)}
.btn.primary:hover{background:var(--amber-deep);color:#fff}
.btn.ghost{background:#fff;color:var(--ink)}
.btn.ghost:hover{background:var(--paper)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:2px 2px 0 #aaa;border-color:#aaa}

/* essay reveal */
.essay-ans{background:#fff8ec;border:2px dashed var(--amber);border-radius:12px;padding:12px 14px;margin-top:14px}
.essay-ans .lab{font-size:.7rem;font-weight:800;color:var(--amber-deep);letter-spacing:1px}
.essay-ans .val{font-weight:700;margin-top:2px}

/* explanation */
.explain{
  margin-top:14px;border-radius:13px;overflow:hidden;
  border:2px solid var(--ink);
  animation:pop .3s ease;
}
.explain .head{padding:9px 14px;font-weight:800;font-size:.9rem;display:flex;align-items:center;gap:8px;color:#fff}
.explain.ok .head{background:var(--leaf)}
.explain.no .head{background:var(--coral)}
.explain .body{background:#fff;padding:13px 15px;font-size:.92rem;line-height:1.8}
.explain .body .ansline{font-weight:800;margin-bottom:7px;color:var(--ink)}
.explain .body .ansline em{font-style:normal;color:var(--leaf);font-weight:900}

/* 講白話按鈕 + 面板 */
.baby-btn{
  display:inline-flex;align-items:center;gap:7px;margin-top:14px;
  background:#fff3d6;border:2px solid var(--amber);color:var(--amber-deep);
  border-radius:22px;padding:9px 18px;font-weight:800;font-size:.92rem;
  cursor:pointer;font-family:inherit;box-shadow:2px 2px 0 var(--amber-deep);
  transition:transform .1s,box-shadow .1s;
}
.baby-btn:hover{background:#ffe9b0}
.baby-btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--amber-deep)}
.baby-panel{
  margin-top:12px;border-radius:14px;overflow:hidden;
  border:2px solid var(--amber);animation:pop .3s ease;
}
.baby-panel .bhead{
  background:linear-gradient(90deg,var(--amber),#ffbe5c);
  color:#5a3d00;padding:9px 15px;font-weight:900;font-size:.92rem;
  display:flex;align-items:center;gap:8px;
}
.baby-panel .bbody{
  background:#fffdf6;padding:14px 16px;font-size:.98rem;line-height:1.95;
}
.baby-panel .bbody br{content:"";display:block;margin:2px 0}

/* 完成頁 */
.finish{text-align:center;padding:30px 10px}
.finish .emoji{font-size:3.4rem;animation:bounce .7s ease}
@keyframes bounce{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.finish h2{font-size:1.7rem;font-weight:900;margin:8px 0}
.scorebox{display:inline-flex;align-items:baseline;gap:6px;background:#fff;border:2px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink);padding:14px 26px;margin:14px 0}
.scorebox .big{font-size:2.6rem;font-weight:900;color:var(--flask-deep)}
.scorebox .small{font-size:1rem;color:#7c8a8e;font-weight:700}
.finish .line{color:#5c6b6f;margin:6px 0 18px;font-weight:600}
.finish .btn{max-width:220px;margin:6px auto;display:block}

/* toast 鼓勵 */
.toast{
  position:fixed;left:50%;top:22%;transform:translateX(-50%) scale(.6);
  background:var(--ink);color:#fff;padding:14px 26px;border-radius:16px;
  font-weight:800;font-size:1.1rem;z-index:80;opacity:0;pointer-events:none;
  box-shadow:0 8px 30px rgba(0,0,0,.3);border:2px solid var(--flask);
  display:flex;align-items:center;gap:10px;
}
.toast.show{animation:toastpop 1.3s ease forwards}
@keyframes toastpop{
  0%{opacity:0;transform:translateX(-50%) scale(.5)}
  15%{opacity:1;transform:translateX(-50%) scale(1.08)}
  30%{transform:translateX(-50%) scale(1)}
  80%{opacity:1}
  100%{opacity:0;transform:translateX(-50%) scale(.9) translateY(-10px)}
}
/* 泡泡 */
.bubbles{position:fixed;inset:0;pointer-events:none;z-index:70}
.bubble{position:absolute;bottom:-30px;border-radius:50%;opacity:.85;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-110vh) rotate(360deg);opacity:0}}

footer.foot{text-align:center;color:#a8a291;font-size:.72rem;padding:24px 0 10px}

.hidden{display:none!important}
</style>
</head>
<body>

<header class="top">
  <svg class="logo-flask" viewBox="0 0 40 40" fill="none">
    <path d="M16 5v10L7 31a3 3 0 0 0 2.6 4.5h20.8A3 3 0 0 0 33 31l-9-16V5" stroke="#f7f4ec" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M12.5 25c3-1.5 5 1.5 8 0s5 1 7.2 0L33 31a3 3 0 0 1-2.6 4.5H9.6A3 3 0 0 1 7 31l5.5-6z" fill="#2ec4b6"/>
    <circle cx="17" cy="30" r="1.6" fill="#f7f4ec"/><circle cx="23" cy="32" r="1.3" fill="#f7f4ec"/>
    <path d="M14 5h12" stroke="#ff9f1c" stroke-width="2.6" stroke-linecap="round"/>
  </svg>
  <div>
    <h1>化學闖關實驗室</h1>
    <div class="sub">必修化學 · 實力評量 8 回</div>
  </div>
  <div class="streak" id="streakChip">🔥 連對 0</div>
</header>

<div class="wrap">
  <!-- 首頁 -->
  <main id="home">
    <section class="hero">
      <div class="eyebrow">Chemistry Quest</div>
      <h2>把每一題<br>都<span class="hl">變成你會的</span></h2>
      <p>選一回，逐題作答。答錯不扣分，每題都有詳解；看不懂還能按 🍼「講白話」，用生活比喻講到你懂。</p>
      <div class="progress-orb">
        <div class="orb"><div class="num" id="orbDone">0</div><div class="lab">已完成題數</div></div>
        <div class="orb"><div class="num" id="orbTotal">142</div><div class="lab">總題數</div></div>
        <div class="orb"><div class="num" id="orbAcc">—</div><div class="lab">答對率</div></div>
      </div>
    </section>
    <div class="grid" id="chapterGrid"></div>
    <button class="reset-all" id="resetAll">清除所有進度紀錄</button>
  </main>

  <!-- 測驗頁 -->
  <main id="quiz" class="hidden">
    <div class="quiz-head">
      <button class="back-btn" id="backBtn">← 回目錄</button>
      <div class="qh-title" id="qhTitle"></div>
    </div>
    <div class="qbar-outer"><div class="qbar-inner" id="qbar"></div></div>
    <div class="qcount" id="qcount"></div>
    <div id="cardMount"></div>
  </main>

  <footer class="foot">泰宇版 必修化學實力評量 · 共 142 題 · 練習用途</footer>
</div>

<div class="toast" id="toast"></div>
<div class="bubbles" id="bubbles"></div>

<script>
// 必修化學 實力評量 — 完整題庫（8 回）
// 每題：id, type(single/multi), q(題幹), options[], answer[], explain(教學詳解), figure(圖片文字描述, 可選)

const EXAMS = [
{
  id: 1, code: "5711", title: "物質的分類與分離方法 ＋ 物質的狀態與相圖",
  subtitle: "第 1 回", score: "5 / 8",
  questions: [
    { id:"1-1", type:"single", q:"下列有關常見物質分類的敘述，何者正確？",
      options:["酒為純乙醇組成，屬純物質","合金由兩種以上元素組成，屬化合物","某一物質的沸點不固定，屬混合物","冰、水、水蒸氣共存時，屬混合物","鹽酸屬於純物質"],
      answer:["C"],
      explain:"沸點不固定 → 表示不只一種成分，屬混合物。<br>(A)酒是乙醇＋水，屬混合物。(B)合金是混合物，不是化合物。(D)冰、水、水蒸氣只是 H₂O 的三種狀態，仍是同一種純物質。(E)鹽酸是 HCl 溶於水，屬混合物。" },

    { id:"1-2", type:"single", q:"有甲、乙、丙、丁四種液體，甲與乙都是無色透明，丙是紅色液體，丁是混濁白色。將四者置於蒸發皿加熱後，甲無任何殘餘物，乙留有白色固體，丙留有紅色固體，丁有白色固體。則何者可能為純物質？",
      options:["甲","乙","丙","丁","都不是"],
      answer:["A"],
      explain:"蒸發後留下固體 → 表示原本溶有溶質，是混合物。乙、丙、丁三種都有固體殘留，都是混合物。只有甲蒸發後完全沒有殘餘物，才可能是純物質。" },

    { id:"1-3", type:"single", q:"昌喵在網路上搜尋到有關純化方法的原理敘述，何者是正確的呢？",
      options:["傾析法是利用物質顆粒大小的差異來分離物質","過濾法是利用物質沸點高低差異來分離物質","層析是利用物質於兩相間附著力的差異來分離物質","萃取是利用物質在兩種互溶溶劑中的溶解度差異來分離物質","蒸餾是利用物質的熔點差異來分離物質"],
      answer:["C"],
      explain:"層析：利用物質對固定相／移動相「附著力（吸附力）」不同而分離，正確。<br>(A)傾析法是利用難溶而易沉降，把上層澄清液倒出。(B)過濾是利用顆粒大小。(D)萃取的兩溶劑必須「互不相溶」。(E)蒸餾是利用「沸點」差異。" },

    { id:"1-4", type:"single", q:"阿皓欲從含有砂粒的食鹽水中分離出食鹽，適合用下列哪幾種純化方法？（甲)過濾法；(乙)傾析法；(丙)蒸餾法；(丁)色層分析法；(戊)結晶法。",
      options:["甲乙","甲戊","丙丁","乙丁","丁戊"],
      answer:["B"],
      explain:"先用「過濾（甲）」把不溶的砂粒濾掉，得到食鹽水；再用「結晶（戊）」把水蒸發、讓食鹽結晶析出。故選甲、戊。（也可用甲＋丙蒸餾，但選項只有甲戊符合。）" },

    { id:"1-5", type:"single", q:"下列各組物質中各有一個是純物質，另一個是混合物。(甲) NaCl(aq) 與 H₂O(l)；(乙)空氣與 N₂(g)；(丙)金銅合金與 Au(s)；(丁)柴油（沸點 180～410℃）與純己烷（沸點 69℃）。水哥在高中實驗室用實驗方法區別純物質與混合物，在 50～150℃間測其沸點就可以區別出來者為？",
      options:["甲乙","乙丙","乙丁","甲丙","甲丁"],
      answer:["E"],
      explain:"要在 50～150℃這個溫度範圍內「加熱沸騰測沸點」才能區別。<br>甲組：NaCl(aq)與H₂O在此範圍會沸騰（水100℃），可測。丁組：純己烷69℃會沸騰、柴油在此範圍不會完全沸騰但可觀察差異——關鍵是兩者在 50～150℃間都能觀察沸騰行為。乙組空氣與N₂沸點極低（－196℃附近），此範圍皆為氣體無法測；丙組合金與Au皆為固體（此範圍不熔化）。故只有甲、丁可行。" },

    { id:"1-6", type:"single", q:"強哥在紙上以圖示的方式來表示物質的狀態和組成，則附圖中何者代表氣態混合物？",
      options:["(A)","(B)","(C)","(D)","(E)"],
      answer:["D"],

    { id:"7-5", type:"single", q:"(甲)CH₃CH₂CO₂⁻、(乙)CH₃(CH₂)₁₁CO₂⁻、(丙)Na⁺、(丁)Cl⁻，上列甲至丁四種基團中，哪兩種的組合適合作為清潔劑？",
      options:["甲、丙","甲、丁","乙、丙","乙、丁","丙、丁"],
      answer:["C"],
      explain:"清潔劑需有『長鏈的親油端』及『帶負電荷的親水端(再配陽離子)』。乙(CH₃(CH₂)₁₁CO₂⁻)有長碳鏈=親油端且帶負電=親水端，配上丙(Na⁺)成為肥皂/清潔劑。故乙、丙組合最適合。" },

    { id:"7-6", type:"single", q:"在硬水中清洗食器時，合成的清潔劑比肥皂更具有洗滌能力，其主要原因為何？",
      options:["合成清潔劑的鈉鹽溶於水，而肥皂的鈉鹽不溶於水","合成清潔劑會與酸作用，而肥皂不與酸作用","肥皂會在硬水中分解，而合成清潔劑不會分解","合成清潔劑的鈣鹽溶於水，而肥皂的鈣鹽不溶於水","合成清潔劑有添加少量的漂白劑"],
      answer:["D"],
      explain:"硬水含Ca²⁺、Mg²⁺。肥皂遇這些離子會形成『不溶於水』的鈣鹽(皂垢)而失效；合成清潔劑的鈣鹽則可溶於水，故在硬水中仍能發揮洗滌力。" },

    { id:"7-7", type:"single", q:"下列有關常見藥物的各種組合或性質，何者正確？",
      options:["止痛藥中的磺胺類藥劑","速效型制酸劑的 NaHCO₃","焦油具有的成癮性","退燒藥中的青黴素","外科手術過程中常用麻醉型的止痛藥為阿司匹靈"],
      answer:["B"],
      explain:"(B)對：NaHCO₃(小蘇打)是速效型制酸劑。<br>(A)磺胺類是消炎藥。(C)焦油不具成癮性(尼古丁才有)。(D)青黴素是抗生素。(E)外科手術常用的麻醉止痛藥是嗎啡，非阿司匹靈。" },

    { id:"7-8", type:"single", q:"根據國中所學的化學原理，湯大頭想製造肥皂。試問下列五種物質中哪一種不是必要的？",
      options:["硫酸","油脂","氫氧化鈉","濃食鹽水","小蘇打水溶液"],
      answer:["A"],
      explain:"製皂(皂化)：油脂+鹼(NaOH)→肥皂+甘油，再用濃食鹽水鹽析出肥皂。小蘇打水可調整。硫酸(酸)不需要且會破壞反應 → 硫酸『不是必要的』。<br>※依詳解：油脂+鹼→皂+甘油，分離皂與甘油需用濃食鹽水；故硫酸為非必要。" },

    { id:"7-9", type:"single", q:"湯小多幫爸爸在夜市賣鹽酥雞，每次收攤回家都發現衣服變得油膩膩的，而且回收的油也變得比較濃稠，下列敘述何者錯誤？",
      options:["可以利用食鹽水去除油汙","回收的油與氫氧化鈉反應，可製造肥皂","回收的油，不可再食用，因恐致癌","衣服上的油汙可用碳酸氫鈉溶液清洗","油的顏色愈深，炸出來的食材愈不健康"],
      answer:["A"],
      explain:"(A)錯：食鹽水是將肥皂與甘油分離用的(鹽析)，並不能去除油汙(食鹽水不具乳化去油能力)。其餘敘述皆正確。" },

    { id:"7-10", type:"single", q:"海水中含有許多的金屬離子，例如鈉離子、鎂離子等。當船員在海上想以海水來清洗器具或洗澡時，使用何種清潔劑無法發揮功能？",
      options:["香皂","洗髮精","沐浴乳","洗碗精","無磷清潔劑"],
      answer:["A"],
      explain:"海水是硬水(含Ca²⁺、Mg²⁺)。『香皂(肥皂)』遇這些離子會產生不溶皂垢而失效。其他合成清潔劑在硬水中仍可使用。故香皂無法發揮功能。" },

    { id:"7-11", type:"multi", q:"下列生活中常見物質的敘述，哪些正確？（應選 2 項）",
      options:["醣類、蛋白質、脂肪完全燃燒只生成 CO₂ 和 H₂O","醣類、蛋白質、脂肪都是天然高分子化合物","汽油、柴油、橄欖油都是只含碳氫的化合物","麥芽糖、脂肪在一定條件下都能發生水解反應","醣類不一定有甜味"],
      answer:["D","E"],
      explain:"(D)對：麥芽糖(雙醣)、脂肪都能水解。(E)對：醣類不一定有甜味(如澱粉、纖維素)。<br>(A)錯：蛋白質含N，燃燒會有含氮氧化物。(B)錯：脂肪是小分子，不是高分子。(C)錯：植物油(橄欖油)含氧，非只含碳氫。" },

    { id:"7-12", type:"multi", q:"下列敘述哪些正確？（應選 3 項）",
      options:["核苷酸結構中含有硫酸根","核糖核酸具有雙股螺旋的結構","核酸包含核糖核酸及去氧核糖核酸","核苷酸結構中含有五碳糖","去氧核糖核酸是構成基因的基本成分之一"],
      answer:["C","D","E"],
      explain:"(C)對：核酸包含RNA(核糖核酸)和DNA(去氧核糖核酸)。(D)對：核苷酸含五碳糖。(E)對：DNA是構成基因的基本成分。<br>(A)錯：核苷酸含『磷酸根』非硫酸根。(B)錯：具雙股螺旋的是DNA(去氧核糖核酸)，RNA通常單股。" },

    { id:"7-13", type:"multi", q:"醣類是重要營養素，而代糖則可作為取代醣類甜味的食品添加物。下列有關醣類與代糖的敘述，哪些正確？（應選 2 項）",
      options:["蔗糖是雙醣","葡萄糖是一種果糖","單醣在體內可以經由代謝產生能量","阿司巴丹(aspartame)是一種代糖，屬於單醣","澱粉及纖維素均為多醣，在人體內皆可分解產生葡萄糖"],
      answer:["A","C"],
      explain:"(A)對：蔗糖由葡萄糖+果糖組成，是雙醣。(C)對：單醣可代謝產生能量。<br>(B)錯：葡萄糖與果糖是同分異構物，不是果糖。(D)錯：阿司巴丹是雙肽分子，非單醣、非聚合物。(E)錯：纖維素在人體內無法分解(缺酵素)。" },

    { id:"7-14", type:"multi", q:"肥皂與清潔劑是日常生活不可缺少的清潔用品，下列有關肥皂與清潔劑的敘述，哪些正確？（應選 2 項）",
      options:["動物油脂用強鹼水解可得肥皂","肥皂分子較不易與硬水作用產生沉澱","肥皂與清潔劑的分子皆具有親水性及親油性","軟性清潔劑分子之長碳鏈有較多支鏈，易被微生物分解","清潔劑常添加磷酸鹽，磷酸鹽流入河川會抑制藻類生長"],
      answer:["A","C"],
      explain:"(A)對：油脂+強鹼(皂化)可製得肥皂。(C)對：肥皂與清潔劑分子都具親水端與親油端。<br>(B)錯：肥皂『較易』與硬水作用產生皂垢沉澱。(D)錯：軟性清潔劑的長碳鏈是『直鏈無支鏈』才易被微生物分解(硬性才有多支鏈)。(E)錯：磷酸鹽會使藻類『大量繁殖(優養化)』，非抑制。" },

    { id:"7-15", type:"multi", q:"下列有關藥物的敘述，哪些正確？（應選 3 項）",
      options:["碳酸氫鈉是消炎藥中的一種","青黴素俗稱盤尼西林，是一種抗生素","氫氧化鋁會和胃酸反應，有制酸作用","磺胺類藥物是止瀉藥物中最普遍的一類","阿司匹靈的學名是乙醯柳酸(又名乙醯水楊酸)"],
      answer:["B","C","E"],
      explain:"(B)對：青黴素=盤尼西林=抗生素。(C)對：氫氧化鋁是制酸劑。(E)對：阿司匹靈學名乙醯柳酸(乙醯水楊酸)。<br>(A)錯：NaHCO₃是制酸劑(胃藥)，非消炎藥。(D)錯：磺胺類是消炎藥中最普遍的一類，非止瀉藥。" },

    { id:"7-16", type:"single", q:"【素養題】牛軋糖外那層「薄薄透明的紙」測試結果如表①(顏色透明無色有光澤、觸感滑膩、味道微甜、可燃燒呈黑色片狀)與表②(加碘液呈藍紫色、加本氏液呈淡藍色、加石蕊試液都不變色、加唾液透明紙穿洞)。根據實驗，下列敘述哪一個正確？",
      options:["摸起來有滑膩感、可以燃燒且具有光澤，湯大頭認為應與脂肪同類","加入本氏液呈淡藍色、加入石蕊試液都不變色，陳清清認為應該不是蛋白質","可以燃燒且加碘液呈藍紫色，米多莉認為應該與澱粉同類","加入唾液會使透明紙穿洞，薛曉真認為唾液可分解透明紙，所以將唾液加入透明玻璃紙也應有相同現象","外觀顏色透明無色、味道微甜，湯小弟推測這與口香糖添加的人工甜味劑類似"],
      answer:["C"],
      figure:"表①測試結果：顏色=透明無色有光澤；觸感=滑膩感；味道=微甜；燃燒=可燃燒且呈黑色片狀或粉狀。表②:加碘液=呈藍紫色；加本氏液=呈淡藍色；加石蕊試液=藍紅石蕊都不變色；加唾液=透明的紙穿洞。",
      explain:"加碘液呈藍紫色是澱粉的特徵反應！故此透明紙(糯米紙)與『澱粉』同類，(C)正確。加唾液會穿洞，是因唾液中澱粉酶把澱粉分解。(D)玻璃紙(纖維素)無法被唾液分解，不會有相同現象。" },

    { id:"7-17", type:"single", q:"【素養題】實驗完成之後，大家推論生活中哪一種材料可以做出薄薄透明又可以吃的紙？",
      options:["糯米","雞蛋","豬大腸內的薄膜","玻璃紙","沒有漂白的原生木頭紙漿"],
      answer:["A"],
      explain:"由前題得知透明紙的主成分是澱粉(遇碘變藍紫)，糯米富含澱粉，可製成可食用的透明糯米紙。故選(A)糯米。" },

    { id:"7-18", type:"single", q:"【素養題】湯大頭將透明的紙、唾液及本氏液放入試管中，隔水加熱一段時間，發現溶液轉成紅色，推論溶液中出現何種物質？",
      options:["脂肪","葡萄糖","澱粉","纖維素","酒精"],
      answer:["B"],
      explain:"唾液中的澱粉酶把澱粉分解成葡萄糖(還原糖)，葡萄糖與本氏液加熱會呈現紅色(磚紅色沉澱)。故溶液中出現的是『葡萄糖』。" },

    { id:"7-19", type:"single", q:"【素養題】根據國中學習的經驗，再推論上述實驗將透明的紙加兩滴硫酸後，發現生成黑色物質且無臭味，試問透明的紙可能含有哪些元素？",
      options:["C、H、N","C、N、O","N、H、O","C、H、O","C、N、S"],
      answer:["D"],
      explain:"碳水化合物(澱粉)遇濃硫酸會脫水生成黑色的『碳』(且無臭味表示不含硫、氮)。澱粉屬碳水化合物，含C、H、O三元素。故選(D)。" },
  ]
},

  id: 8, code: "5701", title: "新興能源與永續發展 ＋ 環境與化學 ＋ 化學在先進科技發展的應用",
  subtitle: "第 8 回", score: "6 / 8",
  questions: [
    { id:"8-1", type:"single", q:"下列各物質中，屬於再生能源的是？",
      options:["煤","石油","天然氣","生質能","核能"],
      answer:["D"],
      explain:"生質能是取之不盡、用之不竭的再生能源。煤、石油、天然氣為化石燃料(不可再生)，核能也屬不可再生。" },

    { id:"8-2", type:"single", q:"氫氣是最乾淨的能源，但是到目前為止，氫氣仍未能成為生活中主要的燃料，你認為原因可能為何？",
      options:["氫氣難儲存及容易氣爆","氫氣難溶於水","氫氣很難燃燒","氫氣太輕","氫氣難以製備"],
      answer:["A"],
      explain:"氫氣具強可燃性和氧化性，儲存與易氣爆是較難處理的問題，這是氫氣尚未普及為主要燃料的主因。" },

    { id:"8-3", type:"single", q:"下列有關能源的敘述何者正確？",
      options:["原子核反應可分為核分裂與核融合兩種，目前世界運轉中的核能電廠，大部分採核融合反應","石油是自然界唯一的不可再生礦物能源","太陽能電池安全又清潔，且轉換功率極高","石油及天然氣的主要成分是碳氫化合物","風力發電一年四季都可提供穩定的發電量"],
      answer:["D"],
      explain:"(D)對：石油、天然氣主成分是碳氫化合物。<br>(A)錯：現行核能電廠大部分採『核分裂』。(B)錯：煤、天然氣也是不可再生礦物能源，非唯一。(C)錯：太陽能電池與核能相比，發電功率仍嫌不足。(E)錯：風力受天候影響，發電量不穩定。" },

    { id:"8-4", type:"single", q:"天然氣主成分是甲烷，為讓天然氣洩漏易被發現，常加入少量乙硫醇(C₂H₅SH)。乙硫醇燃燒方程式：2C₂H₅SH+9O₂→4CO₂+2Y+6H₂O，已知Y由兩種元素組成，則Y的化學式為？",
      options:["SO₂","SO₃","S","H₂SO₄","H₂S"],
      answer:["A"],
      explain:"依方程式平衡並符合原子數守恆。左邊S=2(來自2C₂H₅SH)、右邊需2個Y各含1個S。檢查：左邊O=18，右邊4CO₂(8)+6H₂O(6)=14，缺4個O給2Y → 每個Y含2個O、1個S → Y=SO₂。" },

    { id:"8-5", type:"single", q:"控制地球上CO₂含量是解決溫室效應的有效途徑。將CO₂轉化成有機物的例子很多，試問以下反應中「原子經濟率」最高的是？",
      options:["6CO₂+6H₂O→C₆H₁₂O₆+6O₂","CO₂+3H₂→CH₃OH+H₂O","CO₂+CH₄→CH₃COOH","2CO₂+6H₂→CH₂=CH₂+4H₂O","以上皆非"],
      answer:["C"],
      explain:"原子經濟率=目標產物質量/所有原料質量×100%。若反應中『產物只有一種』(沒有副產物)，表示所有原料原子都進入目標產物，原子經濟率最高=100%。(C)CO₂+CH₄→CH₃COOH 只生成一種產物，故原子經濟率最高。" },

    { id:"8-6", type:"single", q:"2018年8月熱帶性低氣壓在南部造成嚴重災情，水災過後水庫上游水源混濁，需進一步淨化。下列有關都市淨水處理的步驟，何者正確？",
      options:["活性碳可有效吸附不溶的固體雜質及氣味，是淨水程序的第二步","氧化是將空氣打入水中，主要目的是去除水中無機物沉澱","自來水廠過濾步驟處理通常使用逆滲透法，在最後可有效去除溶在水中的金屬離子","沉降法通常在水中加入鋁礬(硫酸鋁)，主要原因是Al³⁺在水中會形成膠體物質，吸附水中細小顆粒而沉降","以上皆非"],
      answer:["D"],
      explain:"(D)對：沉降(混凝)加入明礬/硫酸鋁，Al³⁺水解形成膠體(氫氧化鋁)，吸附細小顆粒使其沉降。<br>(A)活性碳是淨水程序倒數第二步。(B)氧化(打空氣)是使有機物氧化及殺菌，非去除無機物沉澱。(C)自來水廠過濾沒有使用逆滲透法。" },

    { id:"8-7", type:"single", q:"硬水含鈣、鎂等金屬離子。若將1公升硬水分成四等份，分別用下列方法處理：(甲)陽離子交換法，交換鈉離子、(乙)蒸餾法、(丙)陰陽離子交換法，將陽離子交換氫離子、陰離子交換氫氧根離子、(丁)逆滲透法。經處理後的水，其導電度大幅下降的有哪幾種？",

<script>
/* ============ 狀態儲存（記憶體，非 localStorage）============ */
const STORE = {}; // {qid: {answered:true, correct:bool, picked:[]}}
let streak = 0;

const TOTAL = EXAMS.reduce((s,e)=>s+e.questions.length,0);

/* ============ 工具 ============ */
const $ = s=>document.querySelector(s);
const KEYS=["A","B","C","D","E","F"];
function examStats(ex){
  let done=0,correct=0;
  ex.questions.forEach(q=>{const r=STORE[q.id];if(r&&r.answered){done++;if(r.correct)correct++;}});
  return {done,correct,total:ex.questions.length};
}
function globalStats(){
  let done=0,correct=0;
  EXAMS.forEach(e=>e.questions.forEach(q=>{const r=STORE[q.id];if(r&&r.answered){done++;if(r.correct)correct++;}}));
  return {done,correct};
}

    const st=examStats(ex);

    if(st.done===st.total){tagClass="full";tagText="✓ 完成";}
    const card=document.createElement("button");
    card.className="chapter";
    card.innerHTML=`
      <span class="badge">${ex.id}</span>
      <span class="done-tag ${tagClass}">${tagText}</span>
      <h3>${ex.title}</h3>
      <div class="meta">第 ${ex.id} 回 · 編號 ${ex.code} · 共 ${st.total} 題　·　原始得分 ${ex.score}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>`;
    card.onclick=()=>startQuiz(ex.id);
    grid.appendChild(card);
  });
}
function updateStreakChip(){$("#streakChip").textContent="🔥 連對 "+streak;}

/* ============ 測驗流程 ============ */
let curExam=null, curIdx=0;

function startQuiz(examId){
  curExam=EXAMS.find(e=>e.id===examId);
  curIdx=0;
  $("#home").classList.add("hidden");
  $("#quiz").classList.remove("hidden");
  $("#qhTitle").innerHTML=`第 ${curExam.id} 回<small>${curExam.title}</small>`;
  window.scrollTo(0,0);
  renderQuestion();
}
function backHome(){
  $("#quiz").classList.add("hidden");
  $("#home").classList.remove("hidden");
  renderHome();
  window.scrollTo(0,0);
}

function renderQuestion(){
  const q=curExam.questions[curIdx];
  const n=curExam.questions.length;
  $("#qbar").style.width=((curIdx)/n*100)+"%";
  $("#qcount").textContent=`第 ${curIdx+1} / ${n} 題`;

  const typeLabel={single:"單選題",multi:"多選題",essay:"問答題"}[q.type];
  const mount=$("#cardMount");
  mount.innerHTML="";
  const card=document.createElement("div");
  card.className="card";

  let optHtml="";
  if(q.type==="essay"){
    optHtml=`<div id="essayBlock"></div>`;
  }else{
    optHtml=`<div class="options" id="opts">`+
      q.options.map((o,i)=>`
        <button class="opt" data-k="${KEYS[i]}">
          <span class="key">${KEYS[i]}</span>
          <span class="otext">${o}</span>
          <span class="mark"></span>
        </button>`).join("")+`</div>`;
    if(q.type==="multi") optHtml+=`<div class="multi-hint">多選題 · 可選多個答案，選好後按「確認作答」</div>`;
  }

  card.innerHTML=`
    <span class="qtype ${q.type}">${typeLabel}</span>
    <div class="qstem">${q.q}</div>
    ${q.figure?`<div class="figure"><b>◎ 圖片說明</b>${q.figure}</div>`:""}
    ${optHtml}
    <div class="actions" id="actionRow"></div>
    <div id="explainMount"></div>`;
  mount.appendChild(card);

  // 已作答過 → 直接顯示結果
  const prev=STORE[q.id];
  if(prev&&prev.answered){
    if(q.type==="essay"){ showEssay(q,true); }
    else { restoreAnswered(q,prev); }
  }else{
    if(q.type==="essay"){ setupEssay(q); }
    else { setupChoice(q); }
  }
}

/* ---- 選擇題互動 ---- */
let picked=[];
function setupChoice(q){
  picked=[];
  const opts=[...document.querySelectorAll("#opts .opt")];
  opts.forEach(op=>{
    op.onclick=()=>{
      const k=op.dataset.k;
      if(q.type==="single"){
        picked=[k];
        opts.forEach(o=>o.classList.toggle("sel",o.dataset.k===k));
      }else{
        if(picked.includes(k)){picked=picked.filter(x=>x!==k);op.classList.remove("sel");}
        else{picked.push(k);op.classList.add("sel");}
      }
      $("#confirmBtn").disabled=picked.length===0;
    };
  });
  const row=$("#actionRow");
  row.innerHTML=`<button class="btn primary" id="confirmBtn" disabled>確認作答</button>`;
  $("#confirmBtn").onclick=()=>gradeChoice(q);
}

function gradeChoice(q){
  const correctSet=q.answer.slice().sort().join("");
  const pickSet=picked.slice().sort().join("");
  const isCorrect = correctSet===pickSet;
  STORE[q.id]={answered:true,correct:isCorrect,picked:picked.slice()};

  const opts=[...document.querySelectorAll("#opts .opt")];
  opts.forEach(op=>{
    op.classList.add("locked");op.classList.remove("sel");
    const k=op.dataset.k;
    const mark=op.querySelector(".mark");
    if(q.answer.includes(k)){op.classList.add("correct");mark.textContent="✓";}
    else if(picked.includes(k)){op.classList.add("wrong");mark.textContent="✗";}
  });

  if(isCorrect){streak++;fireBubbles();showToast(pickPraise(),"🎉");}
  else{streak=0;}
  updateStreakChip();

  showExplain(q,isCorrect);
  buildNextRow();
}

function restoreAnswered(q,prev){
  const opts=[...document.querySelectorAll("#opts .opt")];
  opts.forEach(op=>{
    op.classList.add("locked");
    const k=op.dataset.k;const mark=op.querySelector(".mark");
    if(q.answer.includes(k)){op.classList.add("correct");mark.textContent="✓";}
    else if(prev.picked&&prev.picked.includes(k)){op.classList.add("wrong");mark.textContent="✗";}
  });
  showExplain(q,prev.correct);
  buildNextRow();
}

/* ---- 問答題 ---- */
function setupEssay(q){
  const row=$("#actionRow");
  row.innerHTML=`<button class="btn primary" id="revealBtn">我想好了 · 看解答</button>`;
  $("#revealBtn").onclick=()=>{
    STORE[q.id]={answered:true,correct:true,picked:[]}; // 問答題以「已學習」計
    streak++; updateStreakChip(); fireBubbles(); showToast("學會一題！","📖");
    showEssay(q,false);
  };
}
function showEssay(q,silent){
  const eb=$("#essayBlock")||document.createElement("div");
  const block=$("#cardMount");
  $("#actionRow").innerHTML="";
  const ansHtml=`<div class="essay-ans"><div class="lab">參考答案</div><div class="val">${q.answer.join("；")}</div></div>`;
  const mount=$("#explainMount");
  mount.innerHTML=ansHtml;
  showExplain(q,true,true);
  buildNextRow();
}

/* ---- 詳解 ---- */
function showExplain(q,ok,isEssay){
  const mount=$("#explainMount");
  const div=document.createElement("div");
  div.className="explain "+(ok?"ok":"no");
  let ansLine="";
  if(!isEssay){
    ansLine=`<div class="ansline">正解：<em>${q.answer.join("、")}</em></div>`;
  }
  div.innerHTML=`
    <div class="head">${ok?(isEssay?"📖 學習重點":"✓ 答對了！"):"✗ 再看一次就懂"}</div>
    <div class="body">${ansLine}${q.explain}</div>`;
  mount.appendChild(div);

  // 🍼 講白話 按鈕（點了才展開）
  if(BABY[q.id]){
    const babyWrap=document.createElement("div");
    babyWrap.innerHTML=`<button class="baby-btn" type="button">🍼 聽不懂？點我講白話</button>`;
    const btn=babyWrap.querySelector(".baby-btn");
    btn.onclick=()=>{
      if(babyWrap.querySelector(".baby-panel")){
        babyWrap.querySelector(".baby-panel").remove();
        btn.innerHTML="🍼 聽不懂？點我講白話";
        return;
      }
      const panel=document.createElement("div");
      panel.className="baby-panel";
      panel.innerHTML=`
        <div class="bhead">🍼 白話版 · 用生活比喻講給你聽</div>
        <div class="bbody">${BABY[q.id]}</div>`;
      babyWrap.appendChild(panel);
      btn.innerHTML="🍼 收起白話版";
    };
    mount.appendChild(babyWrap);
  }
}

/* ---- 下一題 / 完成 ---- */
function buildNextRow(){
  const row=$("#actionRow");
  const isLast=curIdx===curExam.questions.length-1;
  row.innerHTML=`
    ${curIdx>0?`<button class="btn ghost" id="prevBtn">← 上一題</button>`:""}
    <button class="btn primary" id="nextBtn">${isLast?"看成績 🏁":"下一題 →"}</button>`;
  if($("#prevBtn"))$("#prevBtn").onclick=()=>{curIdx--;renderQuestion();window.scrollTo(0,0);};
  $("#nextBtn").onclick=()=>{
    if(isLast){showFinish();}
    else{curIdx++;renderQuestion();window.scrollTo(0,0);}
  };
}

/* ---- 完成頁 ---- */
function showFinish(){
  $("#qbar").style.width="100%";
  $("#qcount").textContent="全部完成";
  const st=examStats(curExam);
  const acc=Math.round(st.correct/st.total*100);
  let emoji="🎉",msg="太厲害了！";
  if(acc<40){emoji="💪";msg="別氣餒，詳解都看過了，再刷一次會更好！";}
  else if(acc<70){emoji="📈";msg="進步中！錯的幾題再回去看一次詳解。";}
  else if(acc<100){emoji="🌟";msg="很棒！離全對只差一點點。";}
  else{emoji="🏆";msg="完美通關！這一回你完全掌握了。";}

  const mount=$("#cardMount");
  mount.innerHTML=`
    <div class="finish">
      <div class="emoji">${emoji}</div>
      <h2>第 ${curExam.id} 回 完成</h2>
      <div class="scorebox"><span class="big">${st.correct}</span><span class="small">/ ${st.total} 題答對</span></div>
      <div class="line">${msg}（答對率 ${acc}%）</div>
      <button class="btn primary" id="retryBtn">重做這一回</button>
      <button class="btn ghost" id="homeBtn">回目錄選下一回</button>
    </div>`;
  $("#retryBtn").onclick=()=>{curExam.questions.forEach(q=>delete STORE[q.id]);startQuiz(curExam.id);};
  $("#homeBtn").onclick=backHome;
  fireBubbles(28);
  window.scrollTo(0,0);
}

/* ============ 鼓勵動畫 ============ */
const PRAISE=["答對了！","漂亮！","就是這個！","化學魂！","穩！","正解 ✓","太準了！","繼續衝！"];
function pickPraise(){
  if(streak>=5)return "連對 "+streak+" 題 🔥";
  if(streak>=3)return "連續答對！";
  return PRAISE[Math.floor(Math.random()*PRAISE.length)];
}
function showToast(text,icon){
  const t=$("#toast");
  t.innerHTML=`<span>${icon||"🎉"}</span><span>${text}</span>`;
  t.classList.remove("show");void t.offsetWidth;t.classList.add("show");
}
const COLORS=["#2ec4b6","#ff9f1c","#e63946","#7b6cf6","#4cc9f0","#43aa8b"];
function fireBubbles(count=16){
  const box=$("#bubbles");
  for(let i=0;i<count;i++){
    const b=document.createElement("div");
    b.className="bubble";
    const size=8+Math.random()*20;
    b.style.width=b.style.height=size+"px";
    b.style.left=(Math.random()*100)+"vw";
    b.style.background=COLORS[Math.floor(Math.random()*COLORS.length)];
    b.style.animationDuration=(2.2+Math.random()*1.8)+"s";
    b.style.animationDelay=(Math.random()*.3)+"s";
    box.appendChild(b);
    setTimeout(()=>b.remove(),4500);
  }
}

/* ============ 綁定 ============ */
$("#backBtn").onclick=backHome;
$("#resetAll").onclick=()=>{
  if(confirm("確定要清除所有作答紀錄嗎？")){
    for(const k in STORE)delete STORE[k];
    streak=0;renderHome();
  }
};

renderHome();
</script>
